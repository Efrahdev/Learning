<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Atomic Observatory — see the periodic table think</title>
<meta name="description" content="An interactive observatory where children derive the periodic table's laws by observing, comparing, predicting and placing — never memorising.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   1 · DESIGN TOKENS — the observatory at night
   ============================================================ */
:root{
  --bg0:#05080f; --bg1:#0a101d; --bg2:#101a2e; --panel:#0c1424; --panel2:#111c33;
  --line:#1c2b49; --line2:#27395e;
  --ink:#eaf1fc; --mut:#93a7c9; --faint:#5b6e93;
  --s:#E69F00; --p:#56B4E9; --d:#00a97b; --f:#CC79A7;
  --gold:#FFD166; --gold2:#ffe3a1; --goldsoft:rgba(255,209,102,.16);
  --amber:#F4A259; --ambersoft:rgba(244,162,89,.15);
  --focus:#7cc4ff;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
  --t-fast:.18s; --t-med:.35s; --t-slow:.7s;
  --ease:cubic-bezier(.33,1,.5,1);
  --font:'Nunito',ui-rounded,'Segoe UI Rounded',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace;
  --z-tt:60; --z-ghost:70; --z-bub:65; --z-modal:80; --z-notice:100;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg0);
  background-image:
    radial-gradient(1100px 600px at 78% -10%, rgba(86,180,233,.08), transparent 60%),
    radial-gradient(900px 700px at -10% 110%, rgba(204,121,167,.06), transparent 60%),
    radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.10), transparent 100%),
    radial-gradient(1.6px 1.6px at 70% 60%, rgba(255,255,255,.09), transparent 100%),
    radial-gradient(1.5px 1.5px at 40% 85%, rgba(255,255,255,.07), transparent 100%),
    radial-gradient(1.5px 1.5px at 88% 25%, rgba(255,255,255,.08), transparent 100%);
  overflow:hidden; min-width:1120px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg0)}
::-webkit-scrollbar-track{background:transparent}
sup{font-size:.62em}
/* ============================================================
   2 · APP LAYOUT
   ============================================================ */
#app{display:grid;height:100vh;
  grid-template:"top top top" auto "dock main ins" 1fr / 222px 1fr 356px;
}
#topbar{grid-area:top;display:flex;align-items:center;gap:var(--sp4);
  padding:10px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(16,26,46,.85),rgba(10,16,29,.6));backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand .orb{width:30px;height:30px;border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle at 35% 35%,var(--gold2),var(--gold) 45%,#b8860b 100%);
  box-shadow:0 0 14px rgba(255,209,102,.5)}
.brand .orb::after{content:"";position:absolute;inset:-6px;border:1.5px solid rgba(124,196,255,.55);
  border-radius:50%;transform:rotateX(60deg)}
.brand h1{font-size:16.5px;font-weight:900;letter-spacing:.3px}
.brand small{display:block;font-size:10.5px;color:var(--mut);font-weight:600;letter-spacing:.4px}
.topctl{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut)}
.topctl .lbl{font-weight:700;letter-spacing:.6px;text-transform:uppercase;font-size:9.5px}
/* ============================================================
   3 · DOCK — non-linear concept navigation
   ============================================================ */
#dock{grid-area:dock;border-right:1px solid var(--line);overflow-y:auto;
  padding:14px 9px 24px;background:rgba(8,13,24,.55)}
.dock-h{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--faint);padding:14px 10px 6px}
.dock-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:8px 10px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--mut);
  transition:background var(--t-fast),color var(--t-fast)}
.dock-i:hover{background:var(--panel2);color:var(--ink)}
.dock-i.on{background:linear-gradient(90deg,var(--goldsoft),transparent 80%);color:var(--ink)}
.dock-i .ic{width:20px;text-align:center;font-size:14px;flex:none}
.dock-i .num{margin-left:auto;font-size:9px;color:var(--faint);font-weight:800}
.dock-i .done{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;
  box-shadow:0 0 8px rgba(255,209,102,.7)}
/* ============================================================
   4 · MAIN STAGE AREA
   ============================================================ */
#main{grid-area:main;overflow-y:auto;padding:18px 20px 60px;position:relative}
.screen{animation:rise .45s var(--ease)}
.qcard{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--r-lg);padding:18px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55}
.qcard .eyebrow{font-size:9.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--gold);margin-bottom:6px}
.qcard h2{font-size:20px;font-weight:900;line-height:1.35}
.qcard .think{font-size:12.5px;color:var(--mut);font-style:italic;margin-top:8px;line-height:1.5}
.toolrow{display:flex;align-items:center;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
/* buttons & chips */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;
  font-size:12.5px;font-weight:800;letter-spacing:.2px;
  background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1d00;
  box-shadow:0 3px 14px rgba(255,209,102,.25);transition:transform var(--t-fast),box-shadow var(--t-fast),opacity var(--t-fast)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(255,209,102,.35)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.btn.gh{background:transparent;color:var(--mut);border:1px solid var(--line2);box-shadow:none}
.btn.gh:hover{color:var(--ink);border-color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;
  font-size:11px;font-weight:800;border:1px solid var(--line2);color:var(--mut);
  transition:all var(--t-fast);background:rgba(16,26,46,.5)}
.chip:hover{color:var(--ink);border-color:var(--faint)}
.chip.on{background:var(--goldsoft);border-color:var(--gold);color:var(--gold2)}
.chipset{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* ============================================================
   5 · ELEMENT CARDS
   ============================================================ */
.shelf{display:flex;gap:12px;flex-wrap:wrap;padding:14px;border:1px dashed var(--line2);
  border-radius:var(--r-lg);min-height:140px;background:rgba(10,16,29,.4);margin-bottom:18px}
.shelf-l{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);
  width:100%;margin-bottom:-4px}
.ecard{width:96px;height:118px;border-radius:14px;position:relative;cursor:pointer;user-select:none;
  background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line2);
  border-left:4px solid var(--bc,var(--line2));
  padding:9px 10px;text-align:left;
  transition:transform var(--t-fast),box-shadow var(--t-fast),border-color var(--t-fast);
  touch-action:none}
.ecard:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.ecard .z{position:absolute;top:7px;right:9px;font-size:10px;font-weight:800;color:var(--faint)}
.ecard .sym{font-size:27px;font-weight:900;line-height:1;margin-top:6px}
.ecard .nm{font-size:10.5px;color:var(--mut);font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ecard .glyph{position:absolute;bottom:7px;right:8px;opacity:.9}
.ecard .eye{position:absolute;bottom:9px;left:10px;font-size:9px;color:var(--faint);opacity:0;transition:opacity var(--t-fast)}
.ecard.inspected .eye{opacity:1;color:var(--p)}
.ecard.sel{border-color:var(--focus);box-shadow:0 0 0 2px rgba(124,196,255,.35),0 0 22px rgba(124,196,255,.28);
  animation:breathe 2.6s ease-in-out infinite}
.ecard.dragging{opacity:.28}
.ecard.ghosted{position:fixed;z-index:var(--z-ghost);pointer-events:none;margin:0;
  transform:scale(1.07) rotate(1.5deg);box-shadow:0 18px 44px rgba(0,0,0,.6);opacity:.96}
.ecard.nudge{animation:wiggle .4s var(--ease)}
.ecard.resonate{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,209,102,.4),0 0 26px rgba(255,209,102,.35)}
.ecard.conflict{border-color:var(--amber);box-shadow:0 0 0 2px rgba(244,162,89,.35);animation:wiggle .45s var(--ease)}
.ecard .vbar{position:absolute;left:10px;right:10px;bottom:26px;height:4px;border-radius:3px;
  background:var(--line);overflow:hidden;opacity:0;transition:opacity var(--t-med)}
.ecard .vbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--gold));
  transition:width .9s var(--ease)}
.ecard.showval .vbar{opacity:1}
.ecard .vnum{position:absolute;bottom:32px;left:10px;font-size:9.5px;font-weight:800;color:var(--gold2);
  opacity:0;transition:opacity var(--t-med)}
.ecard.showval .vnum{opacity:1}
</style>
<style>
/* ============================================================
   6 · TRACK & SLOTS (arrange) · PLACE GRID
   ============================================================ */
.trackwrap{margin:6px 0 16px}
.trackends{display:flex;justify-content:space-between;font-size:11px;font-weight:800;
  color:var(--gold2);letter-spacing:.4px;margin-bottom:6px;padding:0 4px}
.trackends .arr{flex:1;margin:0 14px;position:relative;top:8px;height:2px;
  background:linear-gradient(90deg,rgba(255,209,102,.15),rgba(255,209,102,.55))}
.trackends .arr::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;
  border-left:8px solid rgba(255,209,102,.6)}
.track{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:rgba(12,20,36,.55);justify-content:center}
.slot{width:104px;height:128px;border:2px dashed var(--line2);border-radius:15px;position:relative;
  display:flex;align-items:center;justify-content:center;transition:border-color var(--t-fast),background var(--t-fast),box-shadow var(--t-fast)}
.slot .idx{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;
  color:var(--faint);background:var(--bg1);padding:1px 7px;border-radius:8px;border:1px solid var(--line)}
.slot.hot{border-color:var(--gold);background:var(--goldsoft);box-shadow:0 0 18px rgba(255,209,102,.2)}
.slot.filled{border-style:solid;border-color:var(--line2)}
.slot .ecard{cursor:grab}
.slot .ecard:hover{transform:none}
.pgrid{display:grid;gap:7px;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:rgba(12,20,36,.55);width:max-content;margin-bottom:16px}
.pcell{width:80px;height:96px;border-radius:12px;position:relative}
.pcell.ghostcell{border:1px solid var(--line);background:rgba(16,26,46,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pcell.ghostcell .sym{font-size:18px;font-weight:900;color:var(--faint)}
.pcell.ghostcell .z{font-size:9px;color:var(--faint);opacity:.7}
.pcell.gap{border:2px dashed var(--line2);transition:all var(--t-fast)}
.pcell.gap.hot{border-color:var(--gold);background:var(--goldsoft);box-shadow:0 0 18px rgba(255,209,102,.2)}
.pcell .ecard{width:100%;height:100%;margin:0}
.rowlab{align-self:center;font-size:10px;font-weight:800;color:var(--mut);padding-right:12px;
  text-align:right;line-height:1.35;width:104px}
.collab{font-size:9px;font-weight:800;color:var(--mut);text-align:center;line-height:1.3;
  align-self:end;padding-bottom:4px}
.rowlab.resonate,.collab.resonate{color:var(--gold2);text-shadow:0 0 12px rgba(255,209,102,.6)}
.zonewrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.zone{border:2px dashed var(--zc);border-radius:var(--r-lg);min-height:150px;padding:12px;
  background:color-mix(in srgb,var(--zc) 6%,transparent);transition:box-shadow var(--t-fast)}
.zone.hot{box-shadow:0 0 0 2px var(--zc),0 0 22px color-mix(in srgb,var(--zc) 45%,transparent)}
.zone h4{font-size:13px;font-weight:900;color:var(--zc)}
.zone p{font-size:10.5px;color:var(--mut);margin:3px 0 10px;line-height:1.4}
.zone .zcards{display:flex;gap:8px;flex-wrap:wrap}
.zone .ecard{width:84px;height:100px}
/* ============================================================
   7 · SPEECH BUBBLES & COACH
   ============================================================ */
.bub{position:fixed;z-index:var(--z-bub);max-width:300px;padding:10px 14px;border-radius:13px;
  font-size:12px;font-weight:700;line-height:1.45;background:var(--panel2);
  border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:pop .3s var(--ease)}
.bub::after{content:"";position:absolute;bottom:-7px;left:22px;width:12px;height:12px;
  background:inherit;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);
  transform:rotate(45deg)}
.bub.amber{border-color:var(--amber);background:linear-gradient(160deg,#221a10,var(--panel2));color:#ffd9b3}
.bub.amber::after{border-color:var(--amber)}
.bub.gold{border-color:var(--gold);background:linear-gradient(160deg,#231d0b,var(--panel2));color:var(--gold2)}
.bub.gold::after{border-color:var(--gold)}
.bub.blue{border-color:var(--p)}
/* ============================================================
   8 · PERIODIC TABLE GRID
   ============================================================ */
.ptable{display:grid;grid-template-columns:repeat(18,minmax(34px,52px));gap:4px;
  width:max-content}
.cell{position:relative;border-radius:8px;min-height:40px;padding:3px 4px;text-align:left;
  border:1px solid color-mix(in srgb,var(--bc) 30%,var(--line));
  background:color-mix(in srgb,var(--bc) 9%,var(--panel));
  transition:transform var(--t-fast),box-shadow var(--t-fast);cursor:pointer;overflow:hidden}
.cell:hover{transform:scale(1.12);z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.5);
  border-color:var(--bc)}
.cell .sym{font-size:12.5px;font-weight:900;position:relative;z-index:2}
.cell .z{font-size:7.5px;color:var(--mut);font-weight:800;position:relative;z-index:2;display:block}
.cell .dot{position:absolute;left:50%;top:56%;width:26px;height:26px;border-radius:50%;
  transform:translate(-50%,-50%) scale(0);
  background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--bc) 90%,#fff),var(--bc));
  opacity:.85;z-index:1}
.cell .heat{position:absolute;inset:0;background:var(--gold);opacity:0;z-index:0}
.cell.nul{opacity:.32}
.cell.nul::after{content:"–";position:absolute;right:4px;bottom:2px;font-size:9px;color:var(--faint)}
.cell.frontier{box-shadow:0 0 14px color-mix(in srgb,var(--bc) 60%,transparent);border-color:var(--bc)}
.cell.mystwin{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 24px rgba(255,209,102,.5);animation:ping .8s var(--ease)}
.cell.mystmiss{border-color:var(--amber);animation:wiggle .4s var(--ease)}
.cell[data-fr="1"]{margin-top:16px}
.plab{position:absolute;font-size:9px;font-weight:800;color:var(--faint);letter-spacing:.5px}
.tt{position:fixed;z-index:var(--z-tt);pointer-events:none;background:var(--panel2);
  border:1px solid var(--line2);border-radius:10px;padding:7px 11px;font-size:11px;font-weight:700;
  box-shadow:0 8px 24px rgba(0,0,0,.55);opacity:0;transition:opacity .12s;white-space:nowrap}
.tt b{color:var(--gold2)}
.tt small{display:block;color:var(--mut);font-weight:600;font-size:10px}
/* ============================================================
   9 · INSPECTOR
   ============================================================ */
#inspector{grid-area:ins;border-left:1px solid var(--line);overflow-y:auto;
  background:linear-gradient(180deg,rgba(12,20,36,.7),rgba(8,13,24,.7));padding:16px 16px 40px}
.ins-empty{color:var(--faint);font-size:12.5px;line-height:1.6;text-align:center;padding:60px 20px}
.ins-empty .big{font-size:34px;margin-bottom:10px;opacity:.6}
.ihead{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.ihead .bigsym{font-size:44px;font-weight:900;line-height:1;color:var(--bc,#fff);
  text-shadow:0 0 24px color-mix(in srgb,var(--bc,#fff) 55%,transparent)}
.ihead .meta h3{font-size:16px;font-weight:900}
.ihead .meta .tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:800;letter-spacing:.5px;padding:2.5px 8px;border-radius:999px;
  border:1px solid color-mix(in srgb,var(--tc,var(--faint)) 60%,transparent);
  color:color-mix(in srgb,var(--tc,var(--mut)) 85%,#fff)}
.ihead .pinb{margin-left:auto}
.stagebox{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#0d1730,#060a14 75%);margin-bottom:12px}
#stageCanvas,.labcanvas{display:block;width:100%}
.stagechips{display:flex;gap:5px;padding:9px 10px 4px;flex-wrap:wrap}
.stagecap{font-size:11px;color:var(--mut);padding:4px 12px 2px;min-height:20px;font-weight:700}
.stagecap b{color:var(--gold2)}
.stagecap .cfg{font-family:var(--mono);font-size:10.5px;color:var(--p);letter-spacing:.3px}
/* transport */
.trans{display:flex;align-items:center;gap:8px;padding:8px 10px 11px}
.trans .tbtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--mut);
  transition:all var(--t-fast);flex:none}
.trans .tbtn:hover{color:var(--gold2);border-color:var(--gold)}
.trans input[type=range]{flex:1;accent-color:var(--gold);height:4px;min-width:40px}
.trans select{background:var(--panel2);border:1px solid var(--line2);color:var(--mut);
  border-radius:8px;font-size:10.5px;font-weight:800;padding:4px 5px;font-family:inherit;cursor:pointer}
.trans .tlab{font-size:9px;color:var(--faint);font-weight:800;letter-spacing:.6px}
/* spotlight */
.spot{border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:var(--r-md);
  padding:12px 14px;margin-bottom:12px;background:linear-gradient(160deg,rgba(255,209,102,.07),transparent)}
.spot .sl{font-size:9px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
.spot .sv{font-size:27px;font-weight:900;margin:2px 0 4px}
.spot .sv small{font-size:12px;color:var(--mut);font-weight:700}
.spot .spectrum{height:7px;border-radius:5px;position:relative;margin:9px 0 5px;
  background:linear-gradient(90deg,#22344f,var(--p),var(--gold))}
.spot .marker{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;
  border:2.5px solid var(--gold);transform:translate(-50%,-50%);
  box-shadow:0 0 12px rgba(255,209,102,.8);transition:left .8s var(--ease)}
.spot .sq{font-size:11px;color:var(--mut);font-style:italic;line-height:1.45;margin-top:7px}
.spot .glyphbig{margin:4px 0}
/* property grid */
.props{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:12px}
.prow{background:var(--panel);padding:7px 11px}
.prow dt{font-size:8.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--faint)}
.prow dd{font-size:12px;font-weight:800;margin-top:2px}
.prow dd .u{font-size:9.5px;color:var(--mut);font-weight:700}
.prow.wide{grid-column:1/-1}
.prow .cfg{font-family:var(--mono);font-size:10.5px;color:var(--p);letter-spacing:.2px;font-weight:600}
.factline{font-size:11.5px;color:var(--mut);line-height:1.5;border-left:3px solid var(--f);
  padding:6px 12px;margin-bottom:14px;font-weight:600}
/* tray */
.trayh{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.trayh h4{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}

const AUFBAU=[[1,"s",2],[2,"s",2],[2,"p",6],[3,"s",2],[3,"p",6],[4,"s",2],[3,"d",10],[4,"p",6],[5,"s",2],[4,"d",10],[5,"p",6],[6,"s",2],[4,"f",14],[5,"d",10],[6,"p",6],[7,"s",2],[5,"f",14],[6,"d",10],[7,"p",6]];
const NOBLES=[[2,"He"],[10,"Ne"],[18,"Ar"],[36,"Kr"],[54,"Xe"],[86,"Rn"]];

function aufbauList(z){const out=[];let left=z;
  for(const[n,l,c]of AUFBAU){if(left<=0)break;const take=Math.min(c,left);out.push([n,l,take]);left-=take}

function parseSub(str){return str.trim().split(/\s+/).map(s=>{const m=s.match(/^(\d)([spdf])(\d+)$/);return[+m[1],m[2],+m[3]]})}

  /* the exceptions are quoted the way textbooks print them (by shell). The
     Observatory animates the order rooms are actually filled, so re-sort into
     true Aufbau sequence — the counts, which are the exceptional part, stand. */
  return aufbauList(coreZ).concat(parseSub(EXC[z]))
    .sort((a,b)=>AUFIDX[a[0]+a[1]]-AUFIDX[b[0]+b[1]]);

function shellsFrom(cfg){const sh=[];for(const[n,,c]of cfg){sh[n-1]=(sh[n-1]||0)+c}

    if(EXC[z]){skip=aufbauList(core[0]).length} // exceptions were built as core+tail

<script>
"use strict";
/* ============================================================
   11 · MOTION CORE
   Every animation here is a TL: play, pause, replay, scrub,
   and re-speed from a 0.1x crawl to 3x revision. Nothing moves
   in this app that the learner cannot stop and inspect.

const G={speed:1,rate:1,ambient:true,
  reduced:!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches)};

const Ticker=(function(){
  const fns=new Set();let last=0,running=false;
  function step(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;
    for(const f of Array.from(fns)){try{f(dt,dt*G.speed)}catch(err){console.error(err)}}
    if(fns.size){requestAnimationFrame(step)}else{running=false}
  }
  return{add(f){fns.add(f);
    if(!running){running=true;last=performance.now();requestAnimationFrame(step)}
    return()=>fns.delete(f)}};
})();

class TL{
  constructor(dur,render,opts){
    opts=opts||{};
    this.dur=Math.max(.001,dur);this.render=render;this.loop=!!opts.loop;
    this.t=0;this.rate=opts.rate||G.rate||1;this.playing=false;this.onEnd=opts.onEnd||null;
    this.subs=new Set();this._un=null;this.dead=false;
    if(opts.autoplay===false){this.frame()}else{this.play()}
  }
  frame(){if(!this.dead)this.render(this.t/this.dur,this.t);this.emit()}
  play(){if(this.dead)return;if(!this.loop&&this.t>=this.dur)this.t=0;
    this.playing=true;this.attach();this.frame()}
  pause(){this.playing=false;this.emit()}
  toggle(){this.playing?this.pause():this.play()}
  replay(){this.t=0;this.playing=true;this.attach();this.frame()}
  seek(f){this.t=Math.max(0,Math.min(this.dur,f*this.dur));this.frame()}
  nudge(sec){this.playing=false;this.t=Math.max(0,Math.min(this.dur,this.t+sec));this.frame()}
  setRate(r){this.rate=r;this.emit()}
  get frac(){return this.t/this.dur}
  attach(){if(this._un||this.dead)return;this._un=Ticker.add((dt,sdt)=>this.tick(sdt))}
  tick(sdt){
    if(!this.playing||this.dead)return;
    this.t+=sdt*this.rate;
    if(this.t>=this.dur){
      if(this.loop){this.t%=this.dur}
      else{this.t=this.dur;this.playing=false;this.frame();if(this.onEnd)this.onEnd();return}
    }
    this.frame();
  }
  on(f){this.subs.add(f);f(this);return()=>this.subs.delete(f)}
  emit(){for(const f of Array.from(this.subs))f(this)}
  destroy(){this.dead=true;this.playing=false;if(this._un){this._un();this._un=null}this.subs.clear()}
}

const SPEEDS=[[.1,"0.1x crawl"],[.25,"0.25x"],[.5,"0.5x slow"],[1,"1x normal"],[1.5,"1.5x"],[2,"2x"],[3,"3x fast"]];
function transport(tl,opts){
  opts=opts||{};
  const wrap=h("div","trans");
  const btn=(t,title)=>{const b=h("button","tbtn",t);b.title=title;b.setAttribute("aria-label",title);return b};
  const rep=btn("\u21BA","Replay from the start");
  const pp=btn("\u275A\u275A","Pause");
  const range=document.createElement("input");
  range.type="range";range.min="0";range.max="1000";range.step="1";range.value="0";
  range.setAttribute("aria-label","Scrub through the animation");
  const sel=document.createElement("select");
  sel.title="Playback speed";sel.setAttribute("aria-label","Playback speed");
  SPEEDS.forEach(s=>{const o=document.createElement("option");o.value=String(s[0]);
    o.textContent=s[1];if(s[0]===tl.rate)o.selected=true;sel.appendChild(o)});
  wrap.appendChild(rep);wrap.appendChild(pp);
  if(opts.step){
    const bk=btn("\u25C0","Nudge back a sliver"),fw=btn("\u25B6","Nudge forward a sliver");
    bk.onclick=()=>tl.nudge(-tl.dur/40);fw.onclick=()=>tl.nudge(tl.dur/40);
    wrap.appendChild(bk);wrap.appendChild(fw);
  }
  wrap.appendChild(range);wrap.appendChild(h("span","tlab","SPEED"));wrap.appendChild(sel);
  rep.onclick=()=>tl.replay();
  pp.onclick=()=>tl.toggle();
  range.oninput=()=>{tl.playing=false;tl.seek(+range.value/1000)};
  sel.onchange=()=>tl.setRate(+sel.value);
  tl.on(t=>{
    pp.textContent=t.playing?"\u275A\u275A":"\u25B6";
    pp.title=t.playing?"Pause":"Play";

}

/* ---- pointer drag: click inspects, drag only after a peek ---- */
function dragify(node,cfg){
  node.addEventListener("pointerdown",function(e){
    if(e.button!==0)return;
    const sx=e.clientX,sy=e.clientY,pid=e.pointerId;
    let drag=false,ghost=null,ox=0,oy=0,hot=null,moved=false,gone=false;
    function cleanup(){
      if(gone)return;gone=true;
      node.removeEventListener("pointermove",move);
      node.removeEventListener("pointerup",up);
      node.removeEventListener("pointercancel",up);
      try{node.releasePointerCapture(pid)}catch(_){}
      if(ghost)ghost.remove();
      node.classList.remove("dragging");
      if(hot)hot.classList.remove("hot");
    }
    function move(ev){
      if(ev.pointerId!==pid)return;
      const dx=ev.clientX-sx,dy=ev.clientY-sy;
      if(!drag){
        if(dx*dx+dy*dy<36)return;
        moved=true;
        if(cfg.canDrag&&!cfg.canDrag()){cleanup();if(cfg.onBlocked)cfg.onBlocked();return}
        drag=true;
        const r=node.getBoundingClientRect();ox=sx-r.left;oy=sy-r.top;
        ghost=node.cloneNode(true);ghost.classList.add("ghosted");
        ghost.style.width=r.width+"px";ghost.style.height=r.height+"px";
        document.body.appendChild(ghost);
        node.classList.add("dragging");
        if(cfg.onStart)cfg.onStart();
      }
      ghost.style.left=(ev.clientX-ox)+"px";ghost.style.top=(ev.clientY-oy)+"px";
      const t=dropAt(ev.clientX,ev.clientY);
      if(t!==hot){if(hot)hot.classList.remove("hot");hot=t;if(hot)hot.classList.add("hot")}
    }
    function up(ev){
      if(ev.pointerId!==pid)return;
      const wasDrag=drag,target=hot;
      cleanup();
      if(wasDrag){if(cfg.onDrop)cfg.onDrop(target)}
      else if(!moved){if(cfg.onClick)cfg.onClick()}
    }
    node.addEventListener("pointermove",move);
    node.addEventListener("pointerup",up);
    node.addEventListener("pointercancel",up);
    try{node.setPointerCapture(pid)}catch(_){}
  });
}
function dropAt(x,y){const n=document.elementFromPoint(x,y);return n?n.closest("[data-drop]"):null}

function glyph(e,size){

       '" stroke-opacity="'+(i===n-1?.9:.3)+'" stroke-width="1"/>';

/* ============================================================

   One canvas, six purposes. Radii are drawn to real relative

const TAU=Math.PI*2, CF="Nunito,ui-rounded,system-ui,sans-serif";
const KS=[4,3,2,1,1,1,1], ORBIT_DUR=12;
const IONS={3:{q:1,r:76},8:{q:-2,r:140},9:{q:-1,r:133},11:{q:1,r:102},12:{q:2,r:72},
  13:{q:3,r:53.5},16:{q:-2,r:184},17:{q:-1,r:181},19:{q:1,r:138},20:{q:2,r:100}};

class AtomStage{
  constructor(canvas,opts){
    opts=opts||{};
    this.cv=canvas;this.ctx=canvas.getContext("2d");
    this.hh=opts.h||232;this.el=null;this.mode="orbit";this.tl=null;
    this.pins=[];this.opt={};this.cap="";this.scale=1;this.w=320;
    this.onCaption=opts.onCaption||function(){};
    this.fit();
    if(window.ResizeObserver){
      this._ro=new ResizeObserver(()=>{this.fit();this.paint()});
      this._ro.observe(canvas.parentElement||canvas);
    }
  }
  fit(){
    const cv=this.cv,par=cv.parentElement;
    const w=Math.max(220,(par?par.clientWidth:cv.clientWidth)||320);
    const dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(w*dpr);cv.height=Math.round(this.hh*dpr);
    cv.style.height=this.hh+"px";
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.w=w;
    this.scale=clamp((Math.min(this.hh,w)/2-18)/118,.5,1.7);
  }
  /* ---------- geometry ---------- */
  radPm(e){return e.rad!=null?e.rad:205}
  outer(e){return (26+(clamp(this.radPm(e),25,300)-25)/275*92)*this.scale}
  nucR(e){return (4.5+Math.cbrt(e.z)*1.45)*this.scale}
  ringR(e,i,n,outer){
    const inner=this.nucR(e)+11*this.scale;

  /* ---------- mode switching ---------- */
  set(el,mode,opt){
    this.el=el;this.mode=mode||this.mode;this.opt=opt||{};this.cap="";
    if(this.tl)this.tl.destroy();
    const m=this.mode;
    if(m==="build"){
      this.seq=this.buildSeq(el);
      const per=clamp(9/el.z,.06,.34);
      this.per=per;this.t0=.9;
      this.tl=new TL(this.t0+el.z*per+1,(f,t)=>this.paint(t),{autoplay:!G.reduced});
      if(G.reduced){this.tl.seek(1)}
    }else if(m==="ion"){
      this.tl=new TL(3,(f,t)=>this.paint(t),{autoplay:!G.reduced});
      if(G.reduced)this.tl.seek(1);
    }else if(m==="overlay"){
      this.tl=new TL(2.2,(f,t)=>this.paint(t),{autoplay:!G.reduced});

const LSUB={s:1,p:3,d:5,f:7};
const SUBC={s:"#E69F00",p:"#56B4E9",d:"#00a97b",f:"#CC79A7"};

function orbitalMap(host,opts){
  opts=opts||{};

  const head=h("div","orbhead","<span>Orbital filling \u00b7 Aufbau order</span>");
  const watch=h("button","chip","\u25B6 Watch it fill");
  watch.title="Replay the build, one electron at a time";
  head.appendChild(watch);
  const map=h("div","orbmap"+(opts.big?" big":""));
  const cap=h("div","orbcap");
  wrap.appendChild(head);wrap.appendChild(map);wrap.appendChild(cap);
  host.appendChild(wrap);
  if(opts.onWatch)watch.onclick=opts.onWatch;
  let plan=null,el=null;
  function set(e){
    el=e;plan=orbitalPlan(e);map.innerHTML="";
    plan.subs.forEach(s=>{
      const sd=h("div","osub");sd.style.setProperty("--oc",SUBC[s.l]);
      const bx=h("div","oboxes");
      for(let b=0;b<s.nbox;b++){
        const box=h("span","obox");
        box.appendChild(h("i",null,"\u2191"));box.appendChild(h("i",null,"\u2193"));
        bx.appendChild(box);
      }
      sd.appendChild(bx);sd.appendChild(h("div","olab",s.key));
      sd.title=s.key+" \u00b7 "+s.nbox+" orbital"+(s.nbox>1?"s":"")+", room for "+s.cap+" electrons";
      s.node=sd;s.boxes=bx.children;map.appendChild(sd);

    if(!plan||!el)return;

    }
    const cs=(building&&cur>=0)?plan.seq[cur].sub:null;
    plan.subs.forEach(s=>{
      s.node.classList.toggle("on",s===cs);
      s.node.classList.toggle("full",s.recs.length===s.cap&&s.recs[0].state===2);
    });
    watch.style.display=building?"none":"";
    if(!building){
      const last=lastRoom(el);
      cap.innerHTML='<span class="cfg">'+fullCfg(el)+'</span><br>Ends in <b>'+
        last[0]+last[1]+sup(last[2])+"</b>, so "+el.name+" stands in the <b>"+el.block+"-block</b>.";
      return;
    }

    const s=plan.seq[cur].sub;

    (v==null?"not measured":p.fmt(v))+(v!=null&&p.unit?' <small>'+p.unit+"</small>":"")+"</div>"+
    (n==null?"":'<div class="spectrum"><span class="marker" style="left:0%"></span></div>')+
    '<div class="sq">'+p.story+"</div>";

    const mk=w.querySelector(".marker");

function autoFit(wrap,inner){
  wrap.style.overflow="hidden";
  inner.style.transformOrigin="top left";
  let lastW=-1;
  const fit=()=>{
    const avail=wrap.clientWidth;
    if(!avail)return;
    inner.style.transform="";
    const w=inner.offsetWidth,hh=inner.offsetHeight;
    const s=Math.min(1,avail/(w||1));
    inner.style.transform=s<1?"scale("+s.toFixed(4)+")":"";
    wrap.style.height=Math.ceil(hh*s)+"px";
  };
  requestAnimationFrame(fit);setTimeout(fit,120);
  if(window.ResizeObserver){
    const ro=new ResizeObserver(()=>{const w=wrap.clientWidth;if(w!==lastW){lastW=w;fit()}});
    ro.observe(wrap);
  }
  return fit;
}
function tableIn(host,opts){
  const wrap=h("div");host.appendChild(wrap);
  const t=buildTable(wrap,opts);
  t.fit=autoFit(wrap,t.grid);
  return t;
}
function sweepTL(cells,prop,cap,mode,dur){
  const p=PROPS[prop],prev=new Map(),heat=new Map(),dot=new Map();
  cells.forEach((c,z)=>{
    const hEl=c.querySelector(".heat"),dEl=c.querySelector(".dot");
    heat.set(z,hEl);dot.set(z,dEl);
    hEl.style.background=p.heat;
    c.classList.toggle("nul",p.get(byZ(z))==null);
  });
  const W=13;
  return new TL(dur||7,(f)=>{
    const front=f*(118+W);let cur=null,best=1e9;
    cells.forEach((c,z)=>{
      const local=clamp((front-z)/W,0,1),pv=prev.get(z);
      const d=Math.abs(front-W*.5-z);
      if(d<best){best=d;cur=byZ(z)}
      if(pv===local)return;
      prev.set(z,local);
      const n=norm(prop,p.get(byZ(z)));
      if(n==null){heat.get(z).style.opacity="0";dot.get(z).style.transform="translate(-50%,-50%) scale(0)"}
      else if(mode==="size"){
        dot.get(z).style.transform="translate(-50%,-50%) scale("+(local*(.22+n*1.02)).toFixed(3)+")";
        heat.get(z).style.opacity="0";
      }else{
        heat.get(z).style.opacity=(local*(.1+n*.62)).toFixed(3);
        dot.get(z).style.transform="translate(-50%,-50%) scale(0)";
      }
      c.classList.toggle("frontier",local>.03&&local<.97);
    });
    if(cap&&cur){
      const v=p.get(cur);
      cap.innerHTML="<b>"+cur.name+"</b> \u00b7 "+p.name+": "+
        (v==null?"not measured here":p.fmt(v)+" "+p.unit);
    }
  },{autoplay:false});
}
function playInlineSweep(host,prop,label,mode){
  const box=h("div","sweepbox");
  box.appendChild(h("div","eyebrow",label||("Now watch it across all 118 \u00b7 "+PROPS[prop].name)));
  const tw=h("div");box.appendChild(tw);
  const t=tableIn(tw,{prop:prop});
  const cap=h("div","stagecap");box.appendChild(cap);
  const tl=sweepTL(t.cells,prop,cap,mode);
  box.appendChild(transport(tl,{step:true}));
  host.appendChild(box);
  setTimeout(()=>tl.play(),250);
  return tl;
}

function replayBox(m){
  const L=S.log[m.id]||[];
  const peeks=new Set(L.filter(x=>x.t==="peek").map(x=>x.z)).size;
  const moves=L.filter(x=>x.t==="place").length;
  const hints=L.filter(x=>x.t==="hint").length;
  const tries=L.filter(x=>x.t==="commit").length;
  const bits=[];
  bits.push("You opened "+peeks+" atom"+(peeks===1?"":"s")+" before you decided anything.");
  if(moves)bits.push("You moved cards "+moves+" time"+(moves===1?"":"s")+", and could have moved them a hundred more \u2014 nothing counted until you committed.");
  if(hints)bits.push("You took "+hints+" nudge"+(hints===1?"":"s")+"; every one of them was a question, not an answer.");
  bits.push(tries>1?"It took "+tries+" goes. The one that clashed is the one that taught you where the rule bites.":
    "First go.");
  bits.push("And the thing you found is this: "+m.why+".");
  return h("div","replaybox","<b>How you got here.</b> "+bits.join(" "));
}

function renderArrange(scr,m){
  const N=m.set.length,order=new Array(N).fill(null),bag=shuffle(m.set);
  const nodes=new Map(),slotEls=[];
  const truth=m.set.slice().sort((a,b)=>{
    const va=PROPS[m.prop].get(byZ(a)),vb=PROPS[m.prop].get(byZ(b));
    return m.dir==="asc"?va-vb:vb-va;
  });
  scr.appendChild(qcard(m));
  const tools=h("div","toolrow");scr.appendChild(tools);
  hintUI(m,tools);
  const rs=h("button","btn gh","Start over");rs.onclick=()=>{S.log[m.id]=[];go(m.id)};
  tools.appendChild(rs);
  const cmpNote=h("span","trayhint",m.compareHint);
  cmpNote.style.cssText="margin:0;flex:1;min-width:200px";
  tools.appendChild(cmpNote);
  const predBox=h("div","toolrow");scr.appendChild(predBox);
  /* track */
  const tw=h("div","trackwrap");
  tw.innerHTML='<div class="trackends"><span>'+m.ends[0]+'</span><span class="arr"></span><span>'+
    m.ends[1]+"</span></div>";
  const fitw=h("div"),track=h("div","track");
  for(let i=0;i<N;i++){
    const s=h("div","slot",'<span class="idx">'+(i+1)+"</span>");
    s.dataset.drop="slot";s.dataset.i=i;
    s.addEventListener("click",()=>{if(S.carry!=null)place(S.carry,s)});
    slotEls.push(s);track.appendChild(s);
  }
  fitw.appendChild(track);tw.appendChild(fitw);scr.appendChild(tw);
  autoFit(fitw,track);
  /* shelf */
  const shelf=h("div","shelf");shelf.dataset.drop="shelf";
  shelf.appendChild(h("div","shelf-l","Waiting to be seated \u2014 click an atom to open it, then drag it (or click a seat)"));
  shelf.addEventListener("click",ev=>{if(ev.target===shelf&&S.carry!=null)place(S.carry,shelf)});
  scr.appendChild(shelf);
  /* commit */
  const cb=h("div","commitbar");
  const commit=h("button","btn","Commit this order");commit.disabled=true;
  const status=h("div","status","Seat all "+N+" atoms. Nothing is judged until you commit \u2014 rearrange as often as you like.");
  cb.appendChild(commit);cb.appendChild(status);scr.appendChild(cb);
  const after=h("div");scr.appendChild(after);
  /* cards */
  bag.forEach(z=>{
    const e=byZ(z),c=ecard(e);nodes.set(z,c);
    dragify(c,{
      canDrag:()=>S.seen.has(z),
      onBlocked:()=>{
        inspect(e);c.classList.remove("nudge");void c.offsetWidth;c.classList.add("nudge");
        bubble(c,"Peek first. Click me open and look at my numbers \u2014 you cannot order what you have not examined.","blue");

      onDrop:t=>{if(t)place(z,t);else sync()}
    });
  });
  function mark(){nodes.forEach((n,z)=>n.classList.toggle("sel",S.carry===z))}

function ionShells(e,q){
  const sh=e.shells.slice();
  if(q>0){let left=q;for(let i=sh.length-1;i>=0&&left>0;i--){const t=Math.min(left,sh[i]);sh[i]-=t;left-=t}}
  else if(q<0){sh[sh.length-1]+=-q}
  while(sh.length&&sh[sh.length-1]===0)sh.pop();
  return sh;
}

function makeSweep(cells,prop,cap,mode,list){
  const p=PROPS[prop];
  const scoped=!!list;
  if(!list){list=[];for(let z=1;z<=118;z++)list.push(z)}
  const idx=new Map();list.forEach((z,i)=>idx.set(z,i));
  cells.forEach((c,z)=>{
    const inScope=idx.has(z);
    c.style.opacity=inScope?"1":(scoped?".12":"1");
    c.classList.toggle("nul",inScope&&p.get(byZ(z))==null);
    c.classList.remove("frontier");
    const hEl=c.querySelector(".heat"),dEl=c.querySelector(".dot");
    hEl.style.background=p.heat;
    if(!inScope){hEl.style.opacity="0";dEl.style.transform="translate(-50%,-50%) scale(0)"}
  });
  const W=scoped?1.15:13;
  const dur=scoped?Math.max(3.2,list.length*.62):7;
  const prev=new Map();
  return new TL(dur,f=>{
    const front=f*(list.length+W);
    let cur=null,best=1e9;
    for(let i=0;i<list.length;i++){
      const z=list[i],c=cells.get(z);
      const local=clamp((front-i)/W,0,1);
      const d=Math.abs(front-W*.5-i);
      if(d<best){best=d;cur=byZ(z)}
      if(prev.get(z)===local)continue;
      prev.set(z,local);
      const n=norm(prop,p.get(byZ(z)));
      const hEl=c.querySelector(".heat"),dEl=c.querySelector(".dot");
      if(n==null){hEl.style.opacity="0";dEl.style.transform="translate(-50%,-50%) scale(0)"}
      else if(mode==="size"){
        dEl.style.transform="translate(-50%,-50%) scale("+(local*(.22+n*1.04)).toFixed(3)+")";
        hEl.style.opacity="0";
      }else{
        hEl.style.opacity=(local*(.1+n*.64)).toFixed(3);
        dEl.style.transform="translate(-50%,-50%) scale(0)";
      }
      c.classList.toggle("frontier",local>.03&&local<.97);
    }
    if(cap&&cur){
      const v=p.get(cur);
      cap.innerHTML="<b>"+cur.name+"</b> \u00b7 "+p.name+": "+
        (v==null?"not measured here":p.fmt(v)+" "+p.unit);
    }
  },{autoplay:false});
}

/* ---------- knowledge panel: explanations a child can picture ---------- */
function plainAddress(e){
  const n=e.shells.length;
  let t="<b>Row "+e.period+", column "+(e.group||"the long middle strip")+".</b> ";
  t+="Count the rings in the picture: there are <b>"+n+"</b>, and that is its row number. Every atom on row "+
     e.period+" has exactly "+n+" too. ";
  if(e.block==="s"||e.block==="p")
    t+="It carries <b>"+e.val+" electron"+(e.val>1?"s":"")+"</b> on that outermost ring, and that is what fixes its column. Two counts, and you have its whole address.";
  else if(e.block==="d")
    t+="Its newest electrons are quietly filling a room <b>one floor down</b> instead of on the outside. That is why the middle of the table is so wide, and why these metals all behave rather alike.";
  else
    t+="Its newest electrons are going into a room <b>two floors down</b>, buried deep. That is why these sit in the long strip at the bottom and are so hard to tell apart.";
  return t;
}
function plainPull(e){
  const inner=e.z-e.val,zeff=e.z-inner;
  let t="<b>"+e.z+" protons pull outward, but "+inner+" inner electron"+(inner===1?"":"s")+
    " sit in the way.</b> So the outermost electron only feels about <b>"+zeff+"</b> of that pull. ";
  if(e.noble)t+="Its outside ring is already full, so it has nothing to gain by grabbing or lending. That is why "+
    e.name+" hardly ever joins in with anything.";
  else if(zeff<=2&&e.shells.length>=3)t+="Barely held at all \u2014 which is why "+e.name+
    " hands that electron over the moment anything asks, and why it is such a large atom.";
  else if(zeff>=6)t+="A hard grip \u2014 which is why "+e.name+
    " is small, expensive to steal from, and hungry for somebody else's electrons.";
  else t+="A middling grip, which is why "+e.name+
    " sits between the lenders on the left and the grabbers on the right.";
  return t;
}

function renderShellLab(scr,m){

  L.side.appendChild(h("div","smallnote",

    ["family","Compare two atoms in the same family (Li, Na, K, Rb)"],

    ["pull","Find out how much pull potassium's outer electron really feels"],

      STAGE.tl._ck=true;
      STAGE.tl.on(t=>{if(t.frac>=.999&&!ck.build){ck.build=true;paintCk()}});
    }
    const inner=e.z-e.val,zeff=e.z-inner;
    L.ro.innerHTML="";
    L.ro.appendChild(roItem("protons",e.z,"pulling outward"));
    L.ro.appendChild(roItem("inner electrons",inner,"in the way"));
    L.ro.appendChild(roItem("pull that gets through",zeff+"+","what the outside feels",true));
    L.ro.appendChild(roItem("outer electrons",e.val,"e\u2212"));
    L.ro.appendChild(roItem("rings",e.shells.length,e.shells.join("\u00b7")));
    L.ro.appendChild(roItem("radius",e.rad!=null?e.rad:"\u2014","pm"));

    if(mode==="build")return "Follow the order carefully. Some electrons land on a ring further in than the one before them \u2014 the rooms do not fill in a tidy march outward, and that is exactly why the table has a wide middle.";
    if(mode==="shield")return e.name+" keeps "+inner+" electrons between the middle and the outside. They push back, so "+e.z+" protons end up feeling like only about "+zeff+".";
    if(mode==="pull")return "The outer electron of "+e.name+" is held by roughly "+zeff+", not "+e.z+". That leftover decides how big it is, how tightly it holds on, and how greedy it is \u2014 all three at once.";
    return e.name+": "+e.shells.length+" ring"+(e.shells.length>1?"s":"")+", "+e.val+
      " electron"+(e.val>1?"s":"")+" on the outside, and "+inner+" inside doing the blocking.";

function renderIonLab(scr,m){
  const L=labScaffold(scr,m);
  let curZ=11, q=0;
  const ck={strip:false,add:false,compare:false,slow:false},seenIon=new Set();
  L.side.appendChild(h("div","shelf-l","Pick an atom"));
  const zs=Object.keys(IONS).map(Number).sort((a,b)=>a-b);
  const picker=chipRow(L.side,zs.map(z=>({v:z,label:byZ(z).sym,title:byZ(z).name})),
    z=>{curZ=z;q=0;inspect(byZ(z));apply()},curZ);
  L.side.appendChild(h("div","shelf-l","Do something to it"));
  const acts=h("div","chipset");acts.style.marginBottom="10px";
  const bStrip=h("button","chip","\u2212 Take an electron away");
  const bAdd=h("button","chip","+ Give it an electron");
  const bNeut=h("button","chip","Put it back");
  acts.appendChild(bStrip);acts.appendChild(bAdd);acts.appendChild(bNeut);
  L.side.appendChild(acts);
  const ins=h("div","insight");L.side.appendChild(ins);
  const list=h("ul","checklist");L.side.appendChild(list);
  const CKS=[["strip","Take an electron off a metal and watch what leaves"],
    ["add","Give an electron to a non-metal and watch it swell"],
    ["compare","Look at both Na\u207A and Cl\u207B \u2014 same row, opposite fates"],
    ["slow","Scrub the change at 0.1\u00d7 and catch the moment a ring empties"]];
  L.side.appendChild(h("div","smallnote",
    "Honest footnote: the neutral sizes here are covalent radii and the ion sizes are Shannon ionic radii \u2014 two different rulers. The direction and the size of the change are what matter, not the last digit."));
  function paintCk(){list.innerHTML="";CKS.forEach(c=>list.appendChild(h("li",ck[c[0]]?"ok":"",c[1])))}
  bStrip.onclick=()=>{const i=IONS[curZ];
    if(i.q>0){q=i.q;ck.strip=true;apply()}
    else bubble(bStrip,byZ(curZ).name+" never gives electrons away \u2014 it is one of the grabbers. Try a metal from the left of the table.","amber")};
  bAdd.onclick=()=>{const i=IONS[curZ];
    if(i.q<0){q=i.q;ck.add=true;apply()}
    else bubble(bAdd,byZ(curZ).name+" has no gap worth filling \u2014 metals shed electrons, they do not collect them. Try a non-metal from the right.","amber")};
  bNeut.onclick=()=>{q=0;apply()};
  function apply(){
    const e=byZ(curZ),info=IONS[curZ];
    if(q!==0)seenIon.add(curZ);
    if(seenIon.has(11)&&seenIon.has(17))ck.compare=true;
    if(G.rate<=.25)ck.slow=true;
    bStrip.classList.toggle("on",q>0);bAdd.classList.toggle("on",q<0);bNeut.classList.toggle("on",q===0);
    picker.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",+c.dataset.v===curZ));
    const rIon=q===0?(e.rad!=null?e.rad:200):info.r;
    setStageMode("ion",{q:q,r:rIon});
    const nsh=e.shells,ish=ionShells(e,q),pct=Math.round(rIon/(e.rad||200)*100);
    L.ro.innerHTML="";
    L.ro.appendChild(roItem("protons",e.z,"unchanged"));
    L.ro.appendChild(roItem("electrons",e.z-q,q?"was "+e.z:""));
    L.ro.appendChild(roItem("charge",q===0?"0":(q>0?"+"+q:String(q)),"",q!==0));
    L.ro.appendChild(roItem("rings",ish.length,nsh.length!==ish.length?"was "+nsh.length:""));
    L.ro.appendChild(roItem("radius",Math.round(rIon),"pm"));
    L.ro.appendChild(roItem("size now",pct+"%","of what it was",true));
    ins.textContent=ionInsight(e,q,nsh,ish,pct);
    paintCk();
  }
  function ionInsight(e,q,nsh,ish,pct){
    if(q===0)return e.name+" is balanced: "+e.z+" protons, "+e.z+" electrons, nothing owing. Now take one away, or hand one over, and watch the size change.";
    if(q>0&&ish.length<nsh.length)
      return e.name+" did not simply squeeze. A whole floor went dark \u2014 "+nsh.length+" rings became "+ish.length+
        ". Most of that "+(100-pct)+"% shrink is one empty shell, not squashing.";
    if(q>0)return e.name+" lost "+q+" electron"+(q>1?"s":"")+" but kept all "+e.z+
      " protons. Fewer electrons for the same pull means a tighter hold on each one: down to "+pct+"% of its old size.";
    return e.name+" kept its "+nsh.length+" rings but now holds "+(e.z-q)+" electrons against only "+e.z+
      " protons. Each one is held a little more loosely, they shove each other apart, and the atom swells to "+pct+"% of what it was.";
  }
  S.onInspect=e=>{if(IONS[e.z]&&e.z!==curZ){curZ=e.z;q=0;apply()}};
  S.onStageMode=null;
  inspect(byZ(curZ));apply();
}

function boot(){
  loadState();wireTop();buildDock();go("home");
  if(!Object.keys(S.journal).length){
    setTimeout(()=>{
      const d=document.querySelector('.navi[data-id="z-order"]');
      if(d)bubble(d,"Every idea along this bar is open from the first second. Start wherever you are curious \u2014 nothing is locked.","blue",9000);
    },1400);
  }
}

/* ============================================================
   28 · PLAIN WORDS
   Every technical name in this app carries a child's phrasing
   beside it. The proper term stays — it is simply never alone.
   ============================================================ */
const PLAINP={
  z:"how many protons it has",
  rad:"how big the atom is",
  ie:"how hard it is to pull one electron off",
  en:"how strongly it tugs on shared electrons",
  ea:"how much it likes accepting a spare electron",
  metal:"how easily it lends its outer electrons away",
  shells:"how many rings of electrons it has",
  val:"how many electrons are on the outside ring"
};
const PLAINM={
  home:"the whole map, and every atom on it",
  "z-order":"why the atoms are lined up in the order they are",
  periods:"why the table has rows",
  groups:"why the table has columns",
  blocks:"why the table has four coloured regions",
  "shell-lab":"why an outer electron barely feels the middle",
  "radius-period":"why atoms get smaller as you walk right",
  "radius-group":"why atoms get bigger as you walk down",
  "ion-lab":"what happens when an atom loses or gains an electron",
  ie:"how hard it is to pull one electron off",
  en:"how strongly an atom tugs on shared electrons",
  ea:"how much an atom likes accepting a spare electron",
  metal:"why some atoms are metals and others are not",
  explorer:"watch any pattern sweep across all 118",
  journal:"the rules you worked out for yourself"
};
function qcard(m,extra){
  const c=h("div","qcard");
  c.innerHTML='<div class="eyebrow">'+m.title+(PLAINM[m.id]?' \u00b7 <span class="plainlbl">'+
    PLAINM[m.id]+"</span>":"")+"</div><h2>"+m.q+"</h2>"+
    (m.think?'<div class="think">'+m.think+"</div>":"")+(extra||"");
  return c;
}
function spotlight(e,key){
  const w=h("div","spot");
  if(key==="config"){
    const last=lastRoom(e);
    w.innerHTML='<div class="sl">Last room filled <span class="plainlbl">the newest electrons\u2019 address</span></div>'+
      '<div class="sv">'+last[0]+last[1]+sup(last[2])+' <small>\u2192 '+e.block+'-block</small></div>'+
      '<div class="sq">The letter written at the end of the configuration is the same letter as the coloured region it stands in. That is the whole trick.</div>';
    return w;
  }
  const p=PROPS[key],v=p.get(e),n=norm(key,v);
  w.innerHTML='<div class="sl">'+p.name+(PLAINP[key]?' <span class="plainlbl">'+PLAINP[key]+"</span>":"")+
    '</div><div class="sv">'+(v==null?"not measured":p.fmt(v))+
    (v!=null&&p.unit?' <small>'+p.unit+"</small>":"")+"</div>"+
    (n==null?"":'<div class="spectrum"><span class="marker" style="left:0%"></span></div>')+
    '<div class="sq">'+p.story+"</div>";
  if(n!=null){
    const mk=w.querySelector(".marker");
    requestAnimationFrame(()=>{mk.style.left=(n*100).toFixed(1)+"%"});
  }
  return w;
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
